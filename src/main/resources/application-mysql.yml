# MySQL / MariaDB profile: run with SPRING_PROFILES_ACTIVE=mysql
# Hibernate creates/updates the schema automatically (ddl-auto: update), so no SQL script is needed.
# On the VPS: sudo apt install mysql-server, then
#   mysql -u root -p -e "CREATE DATABASE pgstay CHARACTER SET utf8mb4; CREATE USER 'pgstay'@'localhost' IDENTIFIED BY '<password>'; GRANT ALL ON pgstay.* TO 'pgstay'@'localhost'; FLUSH PRIVILEGES;"
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/pgstay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:pgstay}
    password: ${MYSQL_PASSWORD:pgstay}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

app:
  seed-mock-data: ${SEED_MOCK_DATA:false}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://pg-stay.in,https://www.pg-stay.in}
  public-url: ${PUBLIC_URL:https://pg-stay.in}
