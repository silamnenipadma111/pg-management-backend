# Oracle database profile: run with SPRING_PROFILES_ACTIVE=oracle
# Create the schema first with db/oracle/01_schema.sql (and optionally 02_seed_data.sql).
spring:
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:pg_management}
    password: ${ORACLE_PASSWORD:pg_management}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}

app:
  seed-mock-data: ${SEED_MOCK_DATA:false}
