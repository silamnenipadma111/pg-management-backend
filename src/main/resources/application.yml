spring:
  application:
    name: pg-management
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-pg-management-dev-secret}
    expiration-ms: 86400000
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  upload-dir: ${UPLOAD_DIR:./uploads}
  seed-mock-data: ${SEED_MOCK_DATA:true}

---
# Default: in-memory H2 (Oracle compatibility mode) seeded from src/main/resources/mock-data/*.json
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:pgdb;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
