# nginx reverse proxy for the API on the GoDaddy VPS.
# Point a DNS A record (GoDaddy DNS -> api.yourdomain.com) to the VPS IP, then:
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/pg-api
#   sudo ln -s /etc/nginx/sites-available/pg-api /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.yourdomain.com     # free HTTPS certificate
server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
