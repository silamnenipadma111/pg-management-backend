# nginx site config for https://pg-stay.in on the GoDaddy VPS.
# Serves the built Angular app (dist/) and proxies /api + /uploads to the Spring Boot API.
# Install:  sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/pg-stay
#           sudo ln -s /etc/nginx/sites-available/pg-stay /etc/nginx/sites-enabled/
#           sudo certbot --nginx -d pg-stay.in -d www.pg-stay.in   # free HTTPS certificate
server {
    listen 80;
    server_name pg-stay.in www.pg-stay.in;

    root /opt/pg-management/frontend;
    index index.html;

    client_max_body_size 60m;

    # API + uploaded media -> Spring Boot on :8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA: every other route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
